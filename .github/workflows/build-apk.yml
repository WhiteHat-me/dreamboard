name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android Project and Gradle Wrapper
        id: locate-project
        run: |
          echo "Locating Android project root and Gradle wrapper..."
          WRAPPER_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$WRAPPER_PATH" ]; then
            echo "::error::Gradle wrapper (gradlew) not found in the repository!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$WRAPPER_PATH")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Found Gradle wrapper at: $WRAPPER_PATH"
          echo "Android project root set to: $PROJECT_ROOT"

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "::error::Application module 'app' not found under $PROJECT_ROOT!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: |
          chmod +x "$PROJECT_ROOT/gradlew"

      - name: Clean stale caches
        run: |
          echo "Removing stale project-level Gradle and application build caches..."
          rm -rf "$PROJECT_ROOT/.gradle"
          rm -rf "$PROJECT_ROOT/app/build"

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f "$PROJECT_ROOT/debug.keystore" ]; then
            echo "debug.keystore not found. Generating default debug keystore..."
            keytool -genkey -v -keystore "$PROJECT_ROOT/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and verify generated APK
        id: verify-apk
        run: |
          echo "Searching for generated debug APK files..."
          APK_FILES=$(find "$PROJECT_ROOT/app/build" -name "*.apk" -type f)
          if [ -z "$APK_FILES" ]; then
            echo "::error::No APK file generated!"
            exit 1
          fi
          echo "Found generated APK file(s):"
          echo "$APK_FILES"
          FIRST_APK=$(echo "$APK_FILES" | head -n 1)
          echo "APK_PATH=$FIRST_APK" >> $GITHUB_ENV

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
